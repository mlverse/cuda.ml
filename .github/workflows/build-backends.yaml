name: Build backend release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag used by the backend lock
        required: true
        default: cuda-ml-backend-0.4.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        r:
          - 4.1.3
          - 4.2.3
          - 4.3.3
          - 4.4.3
          - 4.5.2
          - 4.6.1

    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build R ${{ matrix.r }} backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/backend.Dockerfile
          target: export
          build-args: |
            R_VERSION=${{ matrix.r }}
            SOURCE_COMMIT=${{ github.sha }}
            BACKEND_BASE_URL=https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}
          outputs: type=local,dest=backend-output

      - uses: actions/upload-artifact@v4
        with:
          name: backend-r-${{ matrix.r }}
          path: backend-output
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: actions/download-artifact@v4
        with:
          pattern: backend-r-*
          path: backend-assets
          merge-multiple: true

      - name: Merge the package backend lock
        run: >-
          Rscript tools/merge-backend-lock.R
          inst/backends/linux-x86_64-glibc2.28.tsv
          backend-assets

      - uses: actions/upload-artifact@v4
        with:
          name: backend-lock
          path: inst/backends/linux-x86_64-glibc2.28.tsv
          if-no-files-found: error

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          backend-assets/*.tar.gz
          inst/backends/linux-x86_64-glibc2.28.tsv
          --draft
          --generate-notes
          --target "$GITHUB_SHA"
          --title "$RELEASE_TAG"
